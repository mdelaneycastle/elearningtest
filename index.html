<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Static Bar Chart from Data File</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .percentage-text {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .chart-container {
      width: 80%;
      max-width: 600px;
      height: 40px;
      background: #ddd;
      margin: auto;
      border-radius: 20px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: {{ site.data.number.value }}%;
      background: teal;
      border-radius: 20px 0 0 20px;
    }
  </style>
</head>
<body>
  <h1>Static Bar Chart from Data File</h1>
  <div class="percentage-text">{{ site.data.number.value }}%</div>
  <div class="chart-container">
    <div class="bar"></div>
  </div>
  <p>The chart above represents the value: {{ site.data.number.value }}%</p>
  <p>To update the chart, modify <code>_data/number.yml</code> and push the changes.</p>
</body>
</html>
