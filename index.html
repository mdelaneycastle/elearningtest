<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chart Updated from Internal Website (JS Version)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .chart {
      width: 300px;
      height: 200px;
      border: 2px solid #333;
      margin: 20px auto;
      position: relative;
    }
    .bar {
      width: 50px;
      background: teal;
      position: absolute;
      bottom: 0;
      left: calc(50% - 25px);
      height: 0;
      transition: height 0.5s;
    }
    /* Use a CSS pseudo-element to display the percentage above the bar */
    .bar::after {
      content: attr(data-percentage);
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Chart Updated from Internal Website</h1>
  <div class="chart">
    <div class="bar" id="chartBar" data-percentage="0%"></div>
  </div>
  <p id="chartText">Achieved: 0%</p>

  <script>
    // URL of the internal page to fetch
    const url = 'http://192.168.28.246/OPSNET2010/RptMTDGalleryTarget.aspx';

    // Fetch the page content. (This requires that the internal site supports CORS.)
    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok: ' + response.statusText);
        }
        return response.text();
      })
      .then(htmlText => {
        // Parse the HTML text into a document using DOMParser.
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        // Locate the span element with ID "lblMTDAch"
        const span = doc.getElementById('lblMTDAch');
        if (span) {
          // The span is expected to contain text like "Achieved: 34.4%"
          const text = span.textContent;
          const match = text.match(/Achieved:\s*([\d\.]+)%/);
          if (match) {
            let value = parseFloat(match[1]);
            // Clamp the value between 0 and 100.
            value = Math.max(0, Math.min(100, value));
            // Update the chart's bar height and its displayed percentage.
            const bar = document.getElementById('chartBar');
            bar.style.height = value + '%';
            bar.setAttribute('data-percentage', value + '%');
            // Also update the text below the chart.
            document.getElementById('chartText').textContent = 'Achieved: ' + value + '%';
          } else {
            document.getElementById('chartText').textContent = 'Could not parse percentage.';
          }
        } else {
          document.getElementById('chartText').textContent = 'Element "lblMTDAch" not found.';
        }
      })
      .catch(error => {
        console.error('Error fetching or parsing:', error);
        document.getElementById('chartText').textContent = 'Error fetching data: ' + error;
      });
  </script>
</body>
</html>
