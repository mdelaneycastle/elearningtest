<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chart Display</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    .chart {
      width: 300px;
      height: 200px;
      border: 2px solid #333;
      margin: 20px auto;
      position: relative;
    }
    .bar {
      width: 50px;
      background: teal;
      position: absolute;
      bottom: 0;
      left: calc(50% - 25px);
      height: 0;
      transition: height 0.5s;
    }
    /* This pseudo-element displays the percentage above the bar */
    .bar::after {
      content: attr(data-percentage);
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Chart Display</h1>
  <div class="chart">
    <div class="bar" id="chartBar" data-percentage="0%"></div>
  </div>
  <p id="chartText">Achieved: 0%</p>
  
  <script>
    // Retrieve the stored value from localStorage
    var storedValue = localStorage.getItem('achievedPercentage');

    if (storedValue) {
      var value = parseFloat(storedValue);
      // Optional: Clamp the value between 0 and 100.
      value = Math.max(0, Math.min(100, value));

      // Update the bar in the chart
      var bar = document.getElementById('chartBar');
      bar.style.height = value + '%';
      bar.setAttribute('data-percentage', value + '%');

      // Update the text below the chart
      document.getElementById('chartText').textContent = 'Achieved: ' + value + '%';
    } else {
      document.getElementById('chartText').textContent = 'No data found. Please load data.html first.';
    }
  </script>
  <p><em>Note: Make sure you visit data.html before this page so the data is available.</em></p>
</body>
</html>
